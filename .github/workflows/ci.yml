name: trip-planner-ci

on: [push, pull_request]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: pytest backend/tests

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend

  # Real Chromium against the real backend (throwaway database, upstream services
  # faked) and a production build of the frontend. See e2e/ and matrix section N.
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm ci --prefix e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  # Both deploys run only on a push to main, and only after ALL test jobs
  # (unit, integration and end-to-end) pass. Vercel's own Git auto-deploy is disabled (frontend/vercel.json), so
  # this job is the only way the frontend goes live.
  deploy-backend:
    needs: [backend-tests, frontend-tests, e2e-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend

  deploy-frontend:
    needs: [backend-tests, frontend-tests, e2e-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Supplied here, not pulled from Vercel: the copy stored in the Vercel
      # project is a "sensitive" variable, which `vercel pull` replaces with
      # the literal text "[SENSITIVE]" -- that would get baked into the
      # bundle as the API URL. A shell variable overrides the pulled file.
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      # Public (it identifies the app to Google, it is not a secret). Optional:
      # when empty the login page simply omits the Google button.
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --global vercel@59
      - run: test -n "$VITE_API_URL" || { echo "::error::repo variable VITE_API_URL is not set"; exit 1; }
      # Run from the repo root: the project's Root Directory setting
      # (frontend) is applied by the CLI. Build-time env vars such as
      # VITE_API_URL are pulled from the Vercel project.
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: vercel build --prod --token="$VERCEL_TOKEN"
      - run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  # After both deploys: is the live app up and wired together? Read-only, no
  # accounts. A failure turns the run red but rolls nothing back. It cannot tell
  # whether the new version is the one answering (see scripts/smoke_test.py).
  smoke-test:
    needs: [deploy-backend, deploy-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: ${{ vars.VITE_API_URL }}
      FRONTEND_URL: https://trip-planner1-nu.vercel.app
    steps:
      - uses: actions/checkout@v4
      - run: test -n "$BACKEND_URL" || { echo "::error::repo variable VITE_API_URL is not set"; exit 1; }
      - run: python3 scripts/smoke_test.py "$BACKEND_URL" "$FRONTEND_URL" --wait 300
